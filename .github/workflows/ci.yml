name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The `[mcp]` extra pins mcp>=1.2,<2 which itself requires Python >=3.10,
        # so the 3.9 leg failed at the install step rather than at a test. The
        # floor below now says >=3.10 for the same reason - claiming 3.9 support
        # we never actually exercised was the bug.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[mcp]" pytest

      - name: Tests
        run: python -m pytest tests -q

      - name: End-to-end smoke (real stdio server)
        run: |
          python -m mcplock snap --out base.json -- python examples/echo_server.py
          python -m mcplock inspect base.json
          python -m mcplock risk base.json --fail-on critical || true
          set +e
          python -m mcplock verify --lock base.json --fail-on breaking -- \
            python examples/echo_server.py --mutated
          code=$?
          set -e
          test "$code" -eq 1

      - name: MCP tool registration
        run: |
          python - <<'PY'
          import asyncio, json, sys
          from mcplock.mcp_server import app

          async def main():
              tools = await app.list_tools()
              names = sorted(t.name for t in tools)
              print("tools:", names)
              assert len(names) == 4, names
              return names

          names = asyncio.run(main())
          assert names == ["mcplock_describe", "mcplock_diff", "mcplock_risk",
                           "mcplock_schema_template"], names
          print("OK: 4 MCP tools registered")
          PY

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - run: ruff check .

  badge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pytest
      - name: README test-count badge vs pytest
        run: |
          # -o addopts= neutralises the project-level addopts="-q": with the -q
          # below it becomes -qq and pytest -qq hides the "N tests collected"
          # line, which is why the fallback grep -c '::' hack existed at all.
          collected=$(python -m pytest --collect-only -q -o addopts= 2>/dev/null | grep -oE '[0-9]+ tests? collected' | grep -oE '^[0-9]+' || true)
          badge=$(grep -oE 'tests-[0-9]+%20passing' README.md | head -1 | grep -oE '[0-9]+' || true)
          echo "collected=${collected:-NOTHING} badge=${badge:-NONE}"
          if [ -z "$collected" ]; then
            echo "::warning::pytest collected nothing - the badge check did not run"
          elif [ "$collected" != "$badge" ]; then
            echo "::warning::README badge says $badge but pytest collects $collected"
          fi
