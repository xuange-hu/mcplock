name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: Is the project registered on PyPI?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      # Trusted Publishing needs the project to exist on PyPI *and* a publisher
      # configured for this repository. Until that one-time setup happens, the
      # upload would fail with "invalid-publisher" and paint a red X on every
      # release - a red X that means "not set up yet", which nobody can tell
      # apart from "the package is broken". So: ask first, skip deliberately,
      # and start publishing on the next release after the setup is done.
      - id: check
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" https://pypi.org/pypi/mcplock-audit/json || true)
          echo "pypi status: $code"
          if [ "$code" = "200" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::mcplock-audit is not on PyPI yet. Register the project and a Trusted Publisher for xuange-hu/mcplock, then re-run this workflow."
          fi

  pypi:
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Check tag matches package version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          ver=$(python -c 'import re,pathlib;print(re.search(r"^version = \"([^\"]+)\"",pathlib.Path("pyproject.toml").read_text(),re.M).group(1))')
          echo "tag=$tag pyproject=$ver"
          test "$tag" = "$ver"

      - run: python -m pip install build

      - run: python -m build

      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # release/v1
