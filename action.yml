name: mcplock
description: >-
  Fail the build when an MCP server's capability surface drifts. Snapshots
  tools/prompts/resources, classifies changes as breaking / risky / new / safe.
author: xuange-hu

branding:
  icon: lock
  color: purple

inputs:
  lockfile:
    description: Path to the committed lockfile.
    required: false
    default: mcplock.json
  command:
    description: >-
      Command that starts the MCP server, e.g. "npx -y my-server". Mutually
      exclusive with `url`.
    required: false
    default: ""
  url:
    description: Streamable HTTP endpoint of an already-running MCP server.
    required: false
    default: ""
  fail-on:
    description: Severity at or above which the check fails.
    required: false
    default: breaking
  update:
    description: Rewrite the lockfile after checking (use with a follow-up commit step).
    required: false
    default: "false"
  extra-args:
    description: Additional CLI flags passed through verbatim.
    required: false
    default: ""

outputs:
  drift:
    description: "true when drift at or above `fail-on` was detected."
    value: ${{ steps.mcplock.outputs.drift }}
  max-severity:
    description: "Highest severity seen: breaking, risky, new or safe."
    value: ${{ steps.mcplock.outputs.max-severity }}
  fingerprint:
    description: Short surface fingerprint of the server that was checked.
    value: ${{ steps.mcplock.outputs.fingerprint }}
  report:
    description: The human-readable drift report.
    value: ${{ steps.mcplock.outputs.report }}

runs:
  using: composite
  steps:
    - name: Install mcplock
      shell: bash
      run: python -m pip install --upgrade mcplock

    - name: Check capability drift
      id: mcplock
      shell: bash
      env:
        INPUT_LOCKFILE: ${{ inputs.lockfile }}
        INPUT_COMMAND: ${{ inputs.command }}
        INPUT_URL: ${{ inputs.url }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_UPDATE: ${{ inputs.update }}
        INPUT_EXTRA_ARGS: ${{ inputs.extra-args }}
      run: python "$GITHUB_ACTION_PATH/entrypoint.py"

    - name: Summarize drift
      if: always()
      shell: bash
      env:
        REPORT: ${{ steps.mcplock.outputs.report }}
        DRIFT: ${{ steps.mcplock.outputs.drift }}
      run: |
        {
          echo "## mcplock capability drift"
          echo
          echo '```'
          echo "$REPORT"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
        echo "drift=$DRIFT"
