[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcplock"
version = "0.1.0"
description = "Capability lockfile and drift detection for MCP servers — snapshot tools/prompts/resources, classify breaking changes, gate CI."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "xuange-hu" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "ai-security",
    "supply-chain",
    "drift-detection",
    "lockfile",
    "sarif",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.2,<2"]

[project.urls]
Homepage = "https://github.com/xuange-hu/mcplock"
Repository = "https://github.com/xuange-hu/mcplock"
Issues = "https://github.com/xuange-hu/mcplock/issues"

[project.scripts]
mcplock = "mcplock.cli:main"
mcplock-mcp = "mcplock.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "UP006", "UP007", "UP035"]
